name: theme download
on:
  # NOTE: Running on every pull request competed with deploys for the rate limit of the Admin API
  # (2 calls per second), so this runs only weekly or manually.
  schedule:
    - cron: "0 1 * * 1" # Every Monday morning
  workflow_dispatch:

# NOTE: Prevent download runs from overlapping each other. Deploy workflows aren't in this group,
# because a group keeps only one pending run and would cancel a pending deploy.
concurrency:
  group: theme-download
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # NOTE: create-pull-request pushes a branch and opens a pull request.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # NOTE: Always download onto main, even when dispatched from another branch,
      # so that the pull request doesn't carry unmerged commits of that branch.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Download liquid
        run: make download/theme
        env:
          THEME_APP_SECRET: ${{ secrets.THEME_APP_SECRET }}
          THEME_ID: ${{ secrets.THEME_ID }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: Update theme
          base: main
          add-paths: theme

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build project
        run: |
          make -s dist
          tar zcvf assets.tar.gz ./k9bookshelf/*
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp assets.tar.gz "${GITHUB_REF_NAME}.tar.gz"
          gh release create "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME}.tar.gz" --title "${GITHUB_REF_NAME}"

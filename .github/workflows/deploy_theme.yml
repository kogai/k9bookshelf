name: deploy theme

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # NOTE: webpack 5.18 uses md4 which is unavailable on OpenSSL 3 (Node.js >= 17) by default.
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: make lint
      - run: make deploy/theme
        if: github.ref == 'refs/heads/main'
        env:
          THEME_APP_SECRET: ${{ secrets.THEME_APP_SECRET }}
          THEME_ID: ${{ secrets.THEME_ID }}
          LOGROCKET_APP_NAME: ${{ secrets.LOGROCKET_APP_NAME }}
